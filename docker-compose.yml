# Local development stack:
#   moodle    : Bitnami Moodle 4.x  → http://localhost:8080  (admin: user/bitnami)
#   moodle-db : MariaDB backing Moodle (private to docker network)
#   postgres  : Postgres for the LTI tool app  → localhost:5432  (postgres/postgres)
#
# The LTI tool itself runs NATIVELY on the host (npm run dev) and is exposed to
# Moodle via ngrok on the static domain configured in .env.
#
# Bring up:    docker compose up -d
# Bring down:  docker compose down
# Reset DBs:   docker compose down -v   # WARNING: deletes Moodle + app data

services:
  moodle-db:
    image: bitnami/mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: bitnami
      MARIADB_USER: bn_moodle
      MARIADB_PASSWORD: bitnami
      MARIADB_DATABASE: bitnami_moodle
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - moodle_db_data:/bitnami/mariadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: bitnami/moodle:4.5
    depends_on:
      moodle-db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: bn_moodle
      MOODLE_DATABASE_PASSWORD: bitnami
      MOODLE_DATABASE_NAME: bitnami_moodle
      MOODLE_USERNAME: user
      MOODLE_PASSWORD: bitnami
      MOODLE_EMAIL: brian.lamb@gmail.com
      MOODLE_SITE_NAME: "Biology Bot Dev"
      MOODLE_SKIP_BOOTSTRAP: "no"
      ALLOW_EMPTY_PASSWORD: "no"
      # Allow Moodle to reach the ngrok URL (needed for LTI keyset fetch).
      MOODLE_SMTP_HOST: ""
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_php_data:/bitnami/moodledata
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biology_bot
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moodle_db_data:
  moodle_data:
  moodle_php_data:
  app_db_data:
